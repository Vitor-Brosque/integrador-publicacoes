<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar post de veículo existente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 16px;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 10px;
        }

        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            background: #111827;
            color: white;
            margin-top: 16px;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .media-card {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 8px;
            background: #fafafa;
            cursor: pointer;
        }

        .media-card.selected {
            border-color: #111827;
            background: #eef2ff;
        }

        .media-card img,
        .media-card video {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            background: #ddd;
        }

        .selected-list {
            display: grid;
            gap: 10px;
            margin-top: 16px;
        }

        .selected-item {
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 12px;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 8px;
            background: #fafafa;
            cursor: grab;
        }

        .selected-item.dragging {
            opacity: 0.5;
            border: 2px dashed #111827;
        }

        .selected-item img,
        .selected-item video {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .platforms {
            display: grid;
            gap: 8px;
            margin-top: 8px;
        }

        .hint {
            color: #666;
            font-size: 14px;
        }

        .help-box {
            margin-top: 8px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #f3f4f6;
            color: #374151;
            font-size: 14px;
        }

        .platform-notes {
            display: grid;
            gap: 8px;
            margin-top: 12px;
            margin-bottom: 8px;
        }

        .platform-note {
            padding: 10px 12px;
            border-radius: 8px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            color: #374151;
            font-size: 14px;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
            margin-left: 4px;
        }

        .danger {
            background: #b91c1c;
            color: white;
            margin-left: 4px;
        }

        .form-error {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 14px;
        }
    </style>
</head>
<body>
    {% include "core/navigation.html" %}
    <div class="card">
        <h1>Criar post de veículo existente</h1>

        <form method="post" id="create-post-form">
            {% csrf_token %}

            <label for="{{ form.vehicle.id_for_label }}">Veículo</label>
            {{ form.vehicle }}

            {{ form.media_asset_ids }}
            <label for="{{ form.post_type.id_for_label }}">Tipo de post</label>
            {{ form.post_type }}
            <div id="post-type-help" class="help-box"></div>

            <label>Mídias do veículo</label>
            <div class="hint">Clique nas mídias que entram nesse post. Depois organize a ordem abaixo.</div>

            <div id="media-grid" class="media-grid"></div>

            <label>Mídias selecionadas e ordem do post</label>
            <div id="selected-list" class="selected-list"></div>

            <label>Plataformas</label>
            <div class="platforms">
                {{ form.platforms }}
            </div>
            <div id="platform-notes" class="platform-notes"></div>
            <div id="form-error" class="form-error"></div>

            <button type="submit">Gerar post</button>
        </form>
    </div>

    <script>
        const vehicleSelect = document.getElementById("{{ form.vehicle.id_for_label }}");
        const postTypeSelect = document.getElementById("{{ form.post_type.id_for_label }}");
        const mediaAssetIdsInput = document.getElementById("{{ form.media_asset_ids.id_for_label }}");
        const mediaGrid = document.getElementById("media-grid");
        const selectedList = document.getElementById("selected-list");
        const postTypeHelp = document.getElementById("post-type-help");
        const platformNotes = document.getElementById("platform-notes");
        const formError = document.getElementById("form-error");
        const form = document.getElementById("create-post-form");
        const platformInputs = Array.from(document.querySelectorAll('input[name="{{ form.platforms.html_name }}"]'));

        const postTypeHelpTexts = {
            single_image: "Foto única exige exatamente 1 imagem.",
            carousel: "Carrossel exige de 2 a 10 imagens.",
            video: "Vídeo exige exatamente 1 arquivo de vídeo."
        };

        const platformBaseNotes = {
            instagram: "Instagram: permite single_image, carousel e video.",
            facebook: "Facebook: permite single_image, carousel e video.",
            tiktok: "TikTok: nesta versão, priorizar video.",
            youtube: "YouTube: nesta versão, permitir apenas video.",
            google_business: "Google Business: priorizar single_image; se carousel, a publicação real pode usar apenas a imagem principal."
        };

        const vehiclesMedia = {
            {% for vehicle in vehicles %}
                "{{ vehicle.id }}": [
                    {% for media in vehicle.media_assets.all %}
                        {
                            id: "{{ media.id }}",
                            fileUrl: "{% if media.public_url %}{{ media.public_url }}{% else %}{{ media.file.url }}{% endif %}",
                            mediaType: "{{ media.media_type }}",
                            fileName: "{{ media.file.name|escapejs }}"
                        },
                    {% endfor %}
                ],
            {% endfor %}
        };

        let selectedMedia = [];
        let draggedIndex = null;

        vehicleSelect.addEventListener("change", () => {
            clearSelectedMedia();
            renderMediaGrid();
            renderSelectedList();
            syncSelectedIds();
        });

        postTypeSelect.addEventListener("change", () => {
            clearSelectedMedia();
            renderMediaGrid();
            renderSelectedList();
            syncSelectedIds();
            updateGuidance();
        });

        form.addEventListener("submit", (event) => {
            const validationError = validateSelection();
            if (validationError) {
                event.preventDefault();
                showFormError(validationError);
            } else {
                hideFormError();
            }
        });

        function getCurrentVehicleMedia() {
            return vehiclesMedia[vehicleSelect.value] || [];
        }

        function getAllowedMediaTypes() {
            if (postTypeSelect.value === "video") {
                return ["video"];
            }

            return ["image"];
        }

        function clearSelectedMedia() {
            selectedMedia = [];
        }

        function renderMediaGrid() {
            mediaGrid.innerHTML = "";

            const allowedTypes = getAllowedMediaTypes();
            const mediaItems = getCurrentVehicleMedia().filter((media) => allowedTypes.includes(media.mediaType));

            if (mediaItems.length === 0) {
                const emptyState = document.createElement("div");
                emptyState.className = "hint";
                emptyState.textContent = "Nenhuma mídia compatível com o tipo de post selecionado.";
                mediaGrid.appendChild(emptyState);
                return;
            }

            mediaItems.forEach((media) => {
                const card = document.createElement("div");
                card.className = "media-card";

                if (selectedMedia.some((item) => item.id === media.id)) {
                    card.classList.add("selected");
                }

                const preview = createPreviewElement(media);
                const label = document.createElement("div");
                label.textContent = media.fileName;
                label.className = "hint";

                card.appendChild(preview);
                card.appendChild(label);

                card.onclick = () => toggleMedia(media);

                mediaGrid.appendChild(card);
            });
        }

        function toggleMedia(media) {
            const existingIndex = selectedMedia.findIndex((item) => item.id === media.id);

            if (existingIndex >= 0) {
                selectedMedia.splice(existingIndex, 1);
            } else {
                selectedMedia.push(media);
            }

            renderMediaGrid();
            renderSelectedList();
            syncSelectedIds();
        }

        function renderSelectedList() {
            selectedList.innerHTML = "";

            if (selectedMedia.length === 0) {
                const emptyState = document.createElement("div");
                emptyState.className = "hint";
                emptyState.textContent = "Selecione as mídias compatíveis com o tipo de post.";
                selectedList.appendChild(emptyState);
                return;
            }

            selectedMedia.forEach((media, index) => {
                const item = document.createElement("div");
                item.className = "selected-item";
                item.draggable = true;

                item.addEventListener("dragstart", () => {
                    draggedIndex = index;
                    item.classList.add("dragging");
                });

                item.addEventListener("dragend", () => {
                    draggedIndex = null;
                    item.classList.remove("dragging");
                });

                item.addEventListener("dragover", (event) => {
                    event.preventDefault();
                });

                item.addEventListener("drop", (event) => {
                    event.preventDefault();

                    if (draggedIndex === null || draggedIndex === index) {
                        return;
                    }

                    moveSelectedMedia(draggedIndex, index);
                });

                const preview = createPreviewElement(media);

                const info = document.createElement("div");
                info.innerHTML = `<strong>Ordem ${index + 1}</strong><br><span class="hint">${media.fileName}</span>`;

                const actions = document.createElement("div");

                const upButton = document.createElement("button");
                upButton.type = "button";
                upButton.className = "secondary";
                upButton.textContent = "Subir";
                upButton.disabled = index === 0;
                upButton.onclick = () => moveSelectedMedia(index, index - 1);

                const downButton = document.createElement("button");
                downButton.type = "button";
                downButton.className = "secondary";
                downButton.textContent = "Descer";
                downButton.disabled = index === selectedMedia.length - 1;
                downButton.onclick = () => moveSelectedMedia(index, index + 1);

                const removeButton = document.createElement("button");
                removeButton.type = "button";
                removeButton.className = "danger";
                removeButton.textContent = "Remover";
                removeButton.onclick = () => toggleMedia(media);

                actions.appendChild(upButton);
                actions.appendChild(downButton);
                actions.appendChild(removeButton);

                item.appendChild(preview);
                item.appendChild(info);
                item.appendChild(actions);

                selectedList.appendChild(item);
            });
        }

        function createPreviewElement(media) {
            if (media.mediaType === "video") {
                const video = document.createElement("video");
                video.src = media.fileUrl;
                video.controls = true;
                return video;
            }

            const img = document.createElement("img");
            img.src = media.fileUrl;
            return img;
        }

        function moveSelectedMedia(fromIndex, toIndex) {
            const item = selectedMedia.splice(fromIndex, 1)[0];
            selectedMedia.splice(toIndex, 0, item);

            renderSelectedList();
            syncSelectedIds();
        }

        function syncSelectedIds() {
            mediaAssetIdsInput.value = selectedMedia.map((media) => media.id).join(",");
        }

        function validateSelection() {
            const type = postTypeSelect.value;
            const selectedCount = selectedMedia.length;

            if (type === "single_image") {
                if (selectedCount !== 1) {
                    return "Foto única exige exatamente 1 imagem.";
                }

                if (selectedMedia[0].mediaType !== "image") {
                    return "Foto única aceita apenas imagem.";
                }
            }

            if (type === "carousel") {
                if (selectedCount < 2 || selectedCount > 10) {
                    return "Carrossel exige de 2 a 10 imagens.";
                }

                const hasInvalidMedia = selectedMedia.some((media) => media.mediaType !== "image");
                if (hasInvalidMedia) {
                    return "Carrossel aceita apenas imagens.";
                }
            }

            if (type === "video") {
                if (selectedCount !== 1) {
                    return "Vídeo exige exatamente 1 arquivo de vídeo.";
                }

                if (selectedMedia[0].mediaType !== "video") {
                    return "Vídeo aceita apenas arquivo de vídeo.";
                }
            }

            const selectedPlatforms = platformInputs.filter((input) => input.checked).map((input) => input.value);
            if (type !== "video" && selectedPlatforms.includes("youtube")) {
                return "YouTube nesta versão aceita apenas posts em vídeo.";
            }
            if (type !== "video" && selectedPlatforms.includes("tiktok")) {
                return "TikTok nesta versão aceita apenas posts em vídeo.";
            }

            return "";
        }

        function updateGuidance() {
            postTypeHelp.textContent = postTypeHelpTexts[postTypeSelect.value] || "";

            platformNotes.innerHTML = "";
            Object.entries(platformBaseNotes).forEach(([platform, note]) => {
                const box = document.createElement("div");
                box.className = "platform-note";
                let finalNote = note;

                if (platform === "youtube") {
                    finalNote = postTypeSelect.value === "video"
                        ? "YouTube: permitido nesta etapa porque o post é vídeo."
                        : "YouTube: bloqueado nesta etapa porque só aceita vídeo.";
                }

                if (platform === "tiktok") {
                    finalNote = postTypeSelect.value === "video"
                        ? "TikTok: permitido nesta etapa porque o post é vídeo."
                        : "TikTok: bloqueado nesta etapa porque só aceita vídeo.";
                }

                box.textContent = finalNote;
                platformNotes.appendChild(box);
            });

            platformInputs.forEach((input) => {
                if (input.value === "youtube" || input.value === "tiktok") {
                    input.disabled = postTypeSelect.value !== "video";
                    if (input.disabled) {
                        input.checked = false;
                    }
                } else {
                    input.disabled = false;
                }
            });
        }

        function showFormError(message) {
            formError.textContent = message;
            formError.style.display = "block";
        }

        function hideFormError() {
            formError.textContent = "";
            formError.style.display = "none";
        }

        updateGuidance();
        renderMediaGrid();
        renderSelectedList();
        syncSelectedIds();
    </script>
</body>
</html>
