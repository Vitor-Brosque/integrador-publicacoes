<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar publicação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 16px;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            box-sizing: border-box;
        }

        input[type="file"] {
            margin-top: 8px;
        }

        button {
            padding: 10px 14px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            background: #111827;
            color: white;
        }

        button.secondary {
            background: #e5e7eb;
            color: #111827;
        }

        button.danger {
            background: #b91c1c;
            color: white;
        }

        .submit-button {
            margin-top: 24px;
            font-size: 15px;
            padding: 12px 18px;
        }

        .hint {
            color: #666;
            font-size: 14px;
            margin-top: 6px;
        }

        .preview-list {
            display: grid;
            gap: 12px;
            margin-top: 18px;
        }

        .preview-item {
            display: grid;
            grid-template-columns: 120px 1fr auto;
            gap: 14px;
            align-items: center;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
        }

        .preview-item img,
        .preview-item video {
            width: 120px;
            height: 85px;
            object-fit: cover;
            border-radius: 8px;
            background: #ddd;
        }

        .file-info {
            font-size: 14px;
        }

        .file-name {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .file-order {
            color: #666;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Criar publicação</h1>

        <form method="post" enctype="multipart/form-data" id="create-post-form">
            {% csrf_token %}

            <label for="{{ form.raw_input.id_for_label }}">Dados do veículo</label>
            {{ form.raw_input }}
            <div class="hint">
                Cole os dados do veículo exatamente como vieram do estoque/anúncio.
            </div>

            <label for="{{ form.media_files.id_for_label }}">Fotos ou vídeos</label>
            {{ form.media_files }}
            <div class="hint">
                Selecione várias fotos. A ordem abaixo será a ordem usada no carrossel.
            </div>

            <div id="preview-list" class="preview-list"></div>

            <button type="submit" class="submit-button">Gerar publicação</button>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById("{{ form.media_files.id_for_label }}");
        const previewList = document.getElementById("preview-list");

        let selectedFiles = [];

        fileInput.addEventListener("change", function () {
            selectedFiles = Array.from(fileInput.files);
            renderPreview();
            syncInputFiles();
        });

        function renderPreview() {
            previewList.innerHTML = "";

            selectedFiles.forEach((file, index) => {
                const item = document.createElement("div");
                item.className = "preview-item";

                const mediaWrapper = document.createElement("div");

                if (file.type.startsWith("image/")) {
                    const img = document.createElement("img");
                    img.src = URL.createObjectURL(file);
                    mediaWrapper.appendChild(img);
                } else if (file.type.startsWith("video/")) {
                    const video = document.createElement("video");
                    video.src = URL.createObjectURL(file);
                    video.controls = true;
                    mediaWrapper.appendChild(video);
                } else {
                    mediaWrapper.textContent = "Arquivo";
                }

                const info = document.createElement("div");
                info.className = "file-info";

                const fileName = document.createElement("div");
                fileName.className = "file-name";
                fileName.textContent = file.name;

                const fileOrder = document.createElement("div");
                fileOrder.className = "file-order";
                fileOrder.textContent = `Ordem no carrossel: ${index + 1}`;

                info.appendChild(fileName);
                info.appendChild(fileOrder);

                const actions = document.createElement("div");
                actions.className = "actions";

                const upButton = document.createElement("button");
                upButton.type = "button";
                upButton.className = "secondary";
                upButton.textContent = "Subir";
                upButton.disabled = index === 0;
                upButton.onclick = () => moveFile(index, index - 1);

                const downButton = document.createElement("button");
                downButton.type = "button";
                downButton.className = "secondary";
                downButton.textContent = "Descer";
                downButton.disabled = index === selectedFiles.length - 1;
                downButton.onclick = () => moveFile(index, index + 1);

                const removeButton = document.createElement("button");
                removeButton.type = "button";
                removeButton.className = "danger";
                removeButton.textContent = "Remover";
                removeButton.onclick = () => removeFile(index);

                actions.appendChild(upButton);
                actions.appendChild(downButton);
                actions.appendChild(removeButton);

                item.appendChild(mediaWrapper);
                item.appendChild(info);
                item.appendChild(actions);

                previewList.appendChild(item);
            });
        }

        function moveFile(fromIndex, toIndex) {
            const file = selectedFiles.splice(fromIndex, 1)[0];
            selectedFiles.splice(toIndex, 0, file);
            renderPreview();
            syncInputFiles();
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderPreview();
            syncInputFiles();
        }

        function syncInputFiles() {
            const dataTransfer = new DataTransfer();

            selectedFiles.forEach((file) => {
                dataTransfer.items.add(file);
            });

            fileInput.files = dataTransfer.files;
        }
    </script>
</body>
</html>
