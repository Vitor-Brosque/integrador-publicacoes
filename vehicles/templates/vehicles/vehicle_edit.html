<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar veículo</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        label { font-weight: bold; display: block; margin-bottom: 8px; margin-top: 12px; }
        textarea { width: 100%; box-sizing: border-box; padding: 10px; }
        button, .button-link { padding: 10px 14px; border: 0; border-radius: 8px; background: #111827; color: white; text-decoration: none; display: inline-block; margin-top: 16px; }
        .message { padding: 12px; border-radius: 8px; background: #e5e7eb; margin-bottom: 12px; }
    </style>
</head>
<body>
    {% include "core/navigation.html" %}
    <div class="card">
        <h1>Editar veículo #{{ vehicle.id }}</h1>

        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label for="{{ form.raw_input.id_for_label }}">Raw input</label>
            {{ form.raw_input }}
            {{ form.raw_input.errors }}

            <button type="submit">Salvar alterações</button>
        </form>
    </div>
</body>
</html>
